name: Build Discovery article

# On-demand only (no schedule): run it from the Actions tab, or dispatch it
# through the API. Inputs mirror build_article.py's environment.
on:
  workflow_dispatch:
    inputs:
      field:
        description: "Field / discipline (e.g. Medicine, Mathematics, History)"
        required: true
        type: string
      topic:
        description: "Article topic (any language; unused in mode=propose)"
        required: false
        default: ""
        type: string
      language:
        description: "Output language code (fa, en, ar, ...)"
        required: false
        default: "fa"
        type: string
      mode:
        description: "Production mode (review = article, propose = topic proposals)"
        required: false
        default: "review"
        type: string
      idea:
        description: "Idea / area description for topic proposals (mode=propose)"
        required: false
        default: ""
        type: string
      batch:
        description: "Proposal batch number 1..5 (mode=propose)"
        required: false
        default: "1"
        type: string
      chat_id:
        description: "Requesting user's Telegram chat id (mode=propose)"
        required: false
        default: ""
        type: string
      article_category:
        description: "Article category: ir | intl (review mode)"
        required: false
        default: ""
        type: string
      article_type:
        description: "Article type code: isc|res|promo|conf|review|isi|scopus|pubmed|ieee|intlconf (review mode)"
        required: false
        default: ""
        type: string
      llm_provider:
        description: "LLM provider override: gemini | github (empty = repo variable LLM_PROVIDER, else gemini)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  models: read

concurrency:
  # Separate queue per mode: a propose run never blocks an article run.
  group: discovery-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poppler-utils (PDF text extraction for the full-text bridge)
        if: ${{ inputs.mode != 'propose' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Build and deliver the article (fail-closed)
        if: ${{ inputs.mode != 'propose' }}
        env:
          FIELD: ${{ inputs.field }}
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          MODE: ${{ inputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          ARTICLE_CHAT_ID: ${{ inputs.chat_id }}
          ARTICLE_CATEGORY: ${{ inputs.article_category }}
          ARTICLE_TYPE: ${{ inputs.article_type }}
          LLM_PROVIDER: ${{ inputs.llm_provider || vars.LLM_PROVIDER || 'gemini' }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_MODEL: ${{ vars.GLM_MODEL }}
          GLM_MAX_TOKENS: ${{ vars.GLM_MAX_TOKENS }}
          LLM_CHAIN: ${{ vars.LLM_CHAIN }}
        run: python build_article.py

      - name: Generate topic proposals (mode=propose, fail-closed)
        if: ${{ inputs.mode == 'propose' }}
        env:
          FIELD: ${{ inputs.field }}
          IDEA: ${{ inputs.idea }}
          BATCH: ${{ inputs.batch }}
          CHAT_ID: ${{ inputs.chat_id }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ inputs.llm_provider || vars.LLM_PROVIDER || 'gemini' }}
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GLM_MODEL: ${{ vars.GLM_MODEL }}
          GLM_MAX_TOKENS: ${{ vars.GLM_MAX_TOKENS }}
          LLM_CHAIN: ${{ vars.LLM_CHAIN }}
        run: python propose_topics.py

      - name: Save progress (record the production in state.json)
        if: ${{ success() && inputs.mode != 'propose' }}
        run: |
          git config user.name "discovery-agent"
          git config user.email "discovery-agent@users.noreply.github.com"
          git add state.json
          if [ -f verify_cache.json ]; then git add verify_cache.json; fi
          if [ -d fulltext ]; then git add fulltext; fi
          git diff --cached --quiet || git commit -m "record production: ${{ inputs.topic }}"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "commit-back push failed after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Save proposals (record the batch in requests/)
        if: ${{ success() && inputs.mode == 'propose' }}
        run: |
          git config user.name "discovery-agent"
          git config user.email "discovery-agent@users.noreply.github.com"
          git add requests
          git diff --cached --quiet || git commit -m "record proposals: batch ${{ inputs.batch }} for ${{ inputs.chat_id }}"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "commit-back push failed after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done
